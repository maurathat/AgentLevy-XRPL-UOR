<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0F1117"/>

  <!-- Title -->
  <text x="960" y="120" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="48" font-weight="300" fill="#e5e7eb">
    Each byte becomes one Braille codepoint
  </text>
  <text x="960" y="180" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="28" fill="#9ca3af">
    codepoint = U+2800 + byte_value
  </text>

  <!-- Header row -->
  <text x="350" y="320" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="24" fill="#6B7280">byte</text>
  <text x="800" y="320" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="24" fill="#6B7280">codepoint</text>
  <text x="1250" y="320" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="24" fill="#6B7280">glyph</text>
  <text x="1700" y="320" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="24" fill="#6B7280">meaning</text>

  <line x1="200" y1="350" x2="1820" y2="350" stroke="#374151" stroke-width="1"/>

  <text x="350" y="440" text-anchor="middle"
        font-family="Menlo, Monaco, monospace"
        font-size="44" fill="#fb923c">
    0x00
  </text>
  <text x="800" y="440" text-anchor="middle"
        font-family="Menlo, Monaco, monospace"
        font-size="36" fill="#9ca3af">
    U+2800
  </text>
  <text x="1250" y="440" text-anchor="middle"
        font-family="Menlo, Monaco, monospace"
        font-size="100" fill="#7DD3FC">
    ⠀
  </text>
  <text x="1700" y="428" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="22" fill="#9ca3af">
    empty (no bits set)
  </text>

  <text x="350" y="600" text-anchor="middle"
        font-family="Menlo, Monaco, monospace"
        font-size="44" fill="#fb923c">
    0x42
  </text>
  <text x="800" y="600" text-anchor="middle"
        font-family="Menlo, Monaco, monospace"
        font-size="36" fill="#9ca3af">
    U+2842
  </text>
  <text x="1250" y="600" text-anchor="middle"
        font-family="Menlo, Monaco, monospace"
        font-size="100" fill="#7DD3FC">
    ⡂
  </text>
  <text x="1700" y="588" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="22" fill="#9ca3af">
    the letter 'B' in ASCII
  </text>

  <text x="350" y="760" text-anchor="middle"
        font-family="Menlo, Monaco, monospace"
        font-size="44" fill="#fb923c">
    0xFF
  </text>
  <text x="800" y="760" text-anchor="middle"
        font-family="Menlo, Monaco, monospace"
        font-size="36" fill="#9ca3af">
    U+28FF
  </text>
  <text x="1250" y="760" text-anchor="middle"
        font-family="Menlo, Monaco, monospace"
        font-size="100" fill="#7DD3FC">
    ⣿
  </text>
  <text x="1700" y="748" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="22" fill="#9ca3af">
    all bits set
  </text>

  <text x="350" y="920" text-anchor="middle"
        font-family="Menlo, Monaco, monospace"
        font-size="44" fill="#fb923c">
    0xA5
  </text>
  <text x="800" y="920" text-anchor="middle"
        font-family="Menlo, Monaco, monospace"
        font-size="36" fill="#9ca3af">
    U+28A5
  </text>
  <text x="1250" y="920" text-anchor="middle"
        font-family="Menlo, Monaco, monospace"
        font-size="100" fill="#7DD3FC">
    ⢥
  </text>
  <text x="1700" y="908" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="22" fill="#9ca3af">
    alternating bits
  </text>

  <!-- Footer -->
  <text x="960" y="1020" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="28" font-style="italic" fill="#6B7280">
    32 bytes -> 32 Braille codepoints. The address IS the byte sequence, visualized.
  </text>
</svg>
