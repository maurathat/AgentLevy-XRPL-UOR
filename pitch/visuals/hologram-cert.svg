<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#283A8C"/>

  <!-- Top hairline -->
  <line x1="130" y1="120" x2="1790" y2="120"
        stroke="#F4EFE4" stroke-width="1" opacity="0.32"/>

  <!-- Eyebrow -->
  <text x="130" y="180" text-anchor="start"
        font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="22" font-weight="500"
        letter-spacing="3" fill="#F4EFE4" opacity="0.7">
    UOR · MODULE CERTIFICATE
  </text>

  <!-- Headline -->
  <text x="960" y="290" text-anchor="middle"
        font-family="'Fraunces', 'Times New Roman', serif" font-size="60" font-weight="600"
        fill="#F4EFE4">
    A real UOR cert in the wild.
  </text>

  <!-- Subject (mono, Cream) -->
  <text x="960" y="385" text-anchor="middle"
        font-family="'IBM Plex Mono', Menlo, monospace" font-size="30" font-weight="500"
        fill="#F4EFE4" opacity="0.85">
    project:hologram-sdk
  </text>

  <!-- Big Braille glyph (Karakurenai on Ruri ground) -->
  <text x="960" y="600" text-anchor="middle"
        font-family="'IBM Plex Mono', Menlo, monospace" font-size="86" font-weight="500"
        fill="#B0223A">
    ⡼⠚⢡⢇⡚⠗⣱⣑⡂⠳⣋⣐⡖⣁⣜⡗⣈⠇⣧⢅⢟⣒⡳⢽⠋⡥⢛⣆⡉⠞⢈⣣
  </text>

  <!-- CID below -->
  <text x="960" y="800" text-anchor="middle"
        font-family="'IBM Plex Mono', Menlo, monospace" font-size="22" font-weight="400"
        fill="#F4EFE4" opacity="0.7">
    baguqeerapqnkdb22c7y5cqrtzpifnqo4k7eapz4ft7jhhpilmwn4msi6rdrq
  </text>

  <!-- Footer line: brand voice + attribution -->
  <text x="130" y="1010" text-anchor="start"
        font-family="'Fraunces', 'Times New Roman', serif" font-size="26" font-weight="500"
        font-style="italic" fill="#F4EFE4" opacity="0.85">
    Every UOR-certified object has the same shape. Kessai's, byte-for-byte.
  </text>
  
  <g opacity="0.55">
    <text x="1790" y="1010" text-anchor="end"
          font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="20" font-weight="500"
